name: Publish to npm (Manual)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type "PUBLISH" to confirm manual publication to npm'
        required: true
        type: string
      dist_tag:
        description: 'npm distribution tag (latest or next)'
        required: true
        default: 'latest'
        type: choice
        options:
          - latest
          - next

concurrency:
  group: npm-publish-manual
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify explicit human confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ github.event.inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "PUBLISH" ]; then
            echo "Error: Manual confirmation must be exactly 'PUBLISH'"
            exit 1
          fi
      - name: Validate package version format
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          echo "Publishing package version: $PACKAGE_VERSION"
          [[ "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]
      - name: Install from lockfile
        run: npm ci
      - name: Test package
        run: npm run check
      - name: Inspect publish contents
        run: npm pack --dry-run

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify explicit human confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ github.event.inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "PUBLISH" ]; then
            echo "Error: Manual confirmation must be exactly 'PUBLISH'"
            exit 1
          fi
      - name: Require npm trusted publishing support
        shell: bash
        run: |
          IFS=. read -r major minor patch <<< "$(npm --version)"
          (( major > 11 || (major == 11 && minor >= 5) ))
      - name: Publish with npm trusted publishing and provenance
        env:
          DIST_TAG: ${{ github.event.inputs.dist_tag || 'latest' }}
        run: npm publish --ignore-scripts --access public --tag "$DIST_TAG"
