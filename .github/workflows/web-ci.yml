name: Web CI
on:
  pull_request:
    paths: &web-paths
      - 'bin/coordinate-agents.mjs'
      - 'lib/web-cli.mjs'
      - 'inspector/server/**'
      - '!inspector/server/inspector-data.mjs'
      - '!inspector/server/server.mjs'
      - 'inspector/web-workspace/**'
      - 'skills/coordinate-agents/adapters/**'
      - 'skills/coordinate-agents/scripts/config.mjs'
      - 'skills/coordinate-agents/scripts/user-config.mjs'
      - 'skills/coordinate-agents/scripts/runtime-contract.mjs'
      - 'skills/coordinate-agents/scripts/runtime-events.mjs'
      - 'skills/coordinate-agents/scripts/pty-runtime.mjs'
      - 'skills/coordinate-agents/scripts/session-*.mjs'
      - 'skills/coordinate-agents/scripts/workspace-*.mjs'
      - 'test/workspace*.test.mjs'
      - 'test/web-distribution.test.mjs'
      - 'test/terminal-polling.test.mjs'
      - 'test/role-prompts.test.mjs'
      - 'test/zen-mode.test.mjs'
      - 'test/native-folder-picker.test.mjs'
      - 'test/session-runtime.test.mjs'
      - 'test/runtime-*.test.mjs'
      - 'test/*adapter*.test.mjs'
      - 'test/user-config.test.mjs'
      - 'test/support/workspace-server.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-ci.yml'
  push:
    branches: [main]
    paths: *web-paths
  workflow_dispatch:
    inputs:
      windows_regression:
        description: Verify the Session and Inspector fixes on Windows Node 22/24
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: web-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  web:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.windows_regression == true && '{"include":[{"os":"windows-latest","node":"22.x"},{"os":"windows-latest","node":"24.x"}]}' || '{"include":[{"os":"ubuntu-latest","node":"24.x"},{"os":"macos-latest","node":"22.x"},{"os":"windows-latest","node":"22.x"}]}') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Web behavior and shared runtime regressions
        run: npm run check:web
      - name: Windows Inspector regression
        if: inputs.windows_regression == true
        run: node --test test/inspector.test.mjs
