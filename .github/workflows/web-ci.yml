name: Web CI
on:
  pull_request:
    paths: &web-paths
      - 'bin/coordinate-agents.mjs'
      - 'lib/web-cli.mjs'
      - 'inspector/server/**'
      - '!inspector/server/inspector-data.mjs'
      - '!inspector/server/server.mjs'
      - 'inspector/web-workspace/**'
      - 'skills/coordinate-agents/adapters/**'
      - 'skills/coordinate-agents/scripts/config.mjs'
      - 'skills/coordinate-agents/scripts/user-config.mjs'
      - 'skills/coordinate-agents/scripts/runtime-contract.mjs'
      - 'skills/coordinate-agents/scripts/runtime-events.mjs'
      - 'skills/coordinate-agents/scripts/pty-runtime.mjs'
      - 'skills/coordinate-agents/scripts/session-*.mjs'
      - 'skills/coordinate-agents/scripts/workspace-*.mjs'
      - 'test/workspace*.test.mjs'
      - 'test/web-distribution.test.mjs'
      - 'test/terminal-polling.test.mjs'
      - 'test/role-prompts.test.mjs'
      - 'test/zen-mode.test.mjs'
      - 'test/native-folder-picker.test.mjs'
      - 'test/session-runtime.test.mjs'
      - 'test/native-pty.test.mjs'
      - 'test/support/native-*.mjs'
      - 'test/runtime-*.test.mjs'
      - 'test/*adapter*.test.mjs'
      - 'test/user-config.test.mjs'
      - 'test/ci-summary.test.mjs'
      - 'scripts/ci-summary.mjs'
      - 'test/support/workspace-server.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-ci.yml'
  push:
    branches: [main]
    paths: *web-paths
  workflow_dispatch:
    inputs:
      windows_regression:
        description: Verify the Session and Inspector fixes on Windows Node 22/24
        type: boolean
        default: false
      native_pty_regression:
        description: Offline native PTY acceptance and Node 18/20 compatibility (manual only)
        type: boolean
        default: false
      host_startup_diagnostic:
        description: Focused Windows Node 20 Host IPC startup diagnostic (not full PTY acceptance)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: web-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  web:
    if: inputs.native_pty_regression != true && inputs.host_startup_diagnostic != true
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.windows_regression == true && '{"include":[{"os":"windows-latest","node":"22.x"},{"os":"windows-latest","node":"24.x"}]}' || '{"include":[{"os":"ubuntu-latest","node":"24.x"},{"os":"macos-latest","node":"22.x"},{"os":"windows-latest","node":"22.x"}]}') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Help and CLI smoke
        run: node bin/coordinate-agents.mjs --help
      - name: Web behavior regressions
        shell: bash
        env:
          NODE_OPTIONS: --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination=.test-results/web.tap
        run: |
          mkdir -p .test-results
          npm run test:web
      - name: Shared runtime regressions
        if: always()
        shell: bash
        env:
          NODE_OPTIONS: --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination=.test-results/shared.tap
        run: |
          mkdir -p .test-results
          npm run test:shared
      - name: Windows native ConPTY regression (no fallback substitution)
        if: always() && runner.os == 'Windows'
        shell: bash
        env:
          NODE_OPTIONS: --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination=.test-results/native-pty.tap
        run: |
          mkdir -p .test-results
          npm run test:native-pty
      - name: Windows Inspector regression
        if: always() && inputs.windows_regression == true
        shell: bash
        env:
          NODE_OPTIONS: --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination=.test-results/inspector.tap
        run: |
          mkdir -p .test-results
          node --test test/inspector.test.mjs
      - name: Publish Test Summary
        if: always()
        shell: bash
        run: |
          node scripts/ci-summary.mjs .test-results/web.tap "Web Behavior"
          node scripts/ci-summary.mjs .test-results/shared.tap "Shared Runtime"
          node scripts/ci-summary.mjs .test-results/native-pty.tap "Windows Native ConPTY"
          node scripts/ci-summary.mjs .test-results/inspector.tap "Windows Inspector"
  native-pty:
    if: github.event_name == 'workflow_dispatch' && inputs.native_pty_regression == true
    name: PTY / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, node: '22.x', native: true }
          - { os: windows-latest, node: '24.x', native: true }
          - { os: ubuntu-latest, node: '24.x', native: true }
          - { os: macos-latest, node: '22.x', native: true }
          - { os: windows-latest, node: '18.x', native: false }
          - { os: windows-latest, node: '20.x', native: true }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:pty
      - name: Strict native binding, TTY and owned Session acceptance
        if: matrix.native == true
        run: npm run test:pty:native
      - name: Existing platform policy and Session regressions
        if: always()
        run: node --test --test-concurrency=1 test/session-runtime.test.mjs test/terminal-polling.test.mjs test/terminal-resize.test.mjs
  host-startup-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.host_startup_diagnostic == true
    name: Host IPC diagnostic / Windows / Node 20
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20.x'
          cache: npm
      - run: npm ci
      - run: node --test --test-name-pattern=unready scripts/pty-probes/native-terminal.integration.mjs
