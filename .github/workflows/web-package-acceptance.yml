name: npm Package Acceptance
on:
  pull_request:
    paths: &package-paths
      - 'package.json'
      - 'package-lock.json'
      - 'bin/coordinate-agents.mjs'
      - 'lib/web-cli.mjs'
      - 'inspector/server/**'
      - '!inspector/server/inspector-data.mjs'
      - '!inspector/server/server.mjs'
      - 'inspector/web-workspace/**'
      - 'skills/coordinate-agents/adapters/**'
      - 'skills/coordinate-agents/scripts/config.mjs'
      - 'skills/coordinate-agents/scripts/user-config.mjs'
      - 'skills/coordinate-agents/scripts/runtime-contract.mjs'
      - 'skills/coordinate-agents/scripts/runtime-events.mjs'
      - 'skills/coordinate-agents/scripts/pty-runtime.mjs'
      - 'skills/coordinate-agents/scripts/session-*.mjs'
      - 'skills/coordinate-agents/scripts/workspace-*.mjs'
      - 'scripts/verify-*.mjs'
      - 'test/release-artifact.test.mjs'
      - 'test/release-workflow.test.mjs'
      - 'test/tar-capability.test.mjs'
      - 'README*.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - '.github/workflows/web-package-acceptance.yml'
      - '.github/workflows/release.yml'
  push:
    branches: [main]
    paths: *package-paths
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Verify all release platform and Node combinations
        type: boolean
        default: true
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      artifact_name:
        description: Exact tarball preserved by the release verify job
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: npm-acceptance-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  package:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Routine changes use three platforms. Manual/full and release callers
      # cover the >=18 even-numbered compatibility lines, including Node 20.
      matrix: ${{ fromJSON((inputs.artifact_name != '' || inputs.full_matrix == true) && '{"os":["ubuntu-latest","macos-latest","windows-latest"],"node":["18.x","20.x","22.x","24.x"]}' || '{"include":[{"os":"ubuntu-latest","node":"24.x"},{"os":"macos-latest","node":"22.x"},{"os":"windows-latest","node":"22.x"}]}') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install test tooling from lockfile
        if: inputs.artifact_name == ''
        run: npm ci
      - name: Pack, install and verify in an isolated consumer and home
        if: inputs.artifact_name == ''
        run: npm run test:package
      - name: Verify publication workflow guards
        if: inputs.artifact_name != ''
        run: node --test test/release-workflow.test.mjs
      - name: Download the exact release tarball
        if: inputs.artifact_name != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/coordinate-agents-artifact
      - name: Verify the exact release tarball on this platform
        if: inputs.artifact_name != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          ARTIFACT_DIR: ${{ runner.temp }}/coordinate-agents-artifact
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "$RELEASE_TAG"
          source_commit="$(git rev-parse HEAD)"
          npm run release:verify -- "$ARTIFACT_DIR/hogancv-coordinate-agents-${version}.tgz" \
            --expected-version "$version" \
            --expected-source-commit "$source_commit" \
            --expected-tag "$RELEASE_TAG"
