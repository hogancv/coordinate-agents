name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Git tag to verify and publish
        required: true
        type: string
      confirmation:
        description: Type PUBLISH to authorize npm publishing
        required: true
        type: string

concurrency:
  group: npm-publish-${{ inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit PUBLISH confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = "PUBLISH"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify release tag matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "v${PACKAGE_VERSION}" = "$RELEASE_TAG"
      - name: Install from lockfile
        run: npm ci
      - name: Test package
        run: npm run check
      - name: Inspect publish contents
        run: npm pack --dry-run

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require npm trusted publishing support
        shell: bash
        run: |
          IFS=. read -r major minor patch <<< "$(npm --version)"
          (( major > 11 || (major == 11 && minor >= 5) ))
      - name: Publish with npm trusted publishing and provenance
        run: npm publish --ignore-scripts --access public --tag latest
