name: Adapter SDK Acceptance

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: [package.json]
  pull_request:
    paths: [package.json]
  workflow_dispatch:

concurrency:
  group: adapter-sdk-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version-change:
    name: Detect package version change
    runs-on: ubuntu-latest
    outputs:
      run_acceptance: ${{ steps.version.outputs.run_acceptance }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare package versions
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$REF_TYPE" == "tag" ]]; then
            echo "run_acceptance=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          compare_sha="$BEFORE_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            compare_sha="$BASE_SHA"
          fi
          if [[ -z "$compare_sha" || "$compare_sha" =~ ^0+$ ]]; then
            echo "run_acceptance=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current_version="$(node -p "require('./package.json').version")"
          if ! previous_package="$(git show "$compare_sha:package.json")"; then
            echo "run_acceptance=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          previous_version="$(printf '%s' "$previous_package" | node -e '
            let input = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => { console.log(JSON.parse(input).version); });
          ')"
          if [[ "$current_version" == "$previous_version" ]]; then
            echo "run_acceptance=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_acceptance=true" >> "$GITHUB_OUTPUT"
          fi

  acceptance:
    needs: version-change
    if: needs.version-change.outputs.run_acceptance == 'true'
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18.x', '22.x']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install from lockfile
        run: npm ci
      - name: Run acceptance checks
        run: npm run check
      - name: Run offline demo
        run: npm run demo

  package-payload:
    needs: version-change
    if: needs.version-change.outputs.run_acceptance == 'true'
    name: Package payload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify generated indexes
        run: npm run check:llms
      - name: Verify package payload
        run: npm pack --dry-run --ignore-scripts

  release-artifact:
    needs: version-change
    if: startsWith(github.ref, 'refs/tags/v') && needs.version-change.outputs.run_acceptance == 'true'
    name: Release artifact / Node 22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install from lockfile
        run: npm ci
      - name: Verify exact tagged artifact
        shell: bash
        env:
          GIT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/coordinate-agents-artifact"
          pack_json="$RUNNER_TEMP/coordinate-agents-pack.json"
          mkdir -p "$artifact_dir"
          npm pack --ignore-scripts --json --pack-destination "$artifact_dir" > "$pack_json"
          artifact="$(PACK_JSON="$pack_json" ARTIFACT_DIR="$artifact_dir" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { join } from "node:path";
            const [entry] = JSON.parse(readFileSync(process.env.PACK_JSON, "utf8"));
            console.log(join(process.env.ARTIFACT_DIR, entry.filename));
          ')"
          version="$(node -p "require('./package.json').version")"
          npm run release:verify -- "$artifact" \
            --expected-version "$version" \
            --expected-source-commit "$GIT_SHA" \
            --expected-tag "$RELEASE_TAG"
