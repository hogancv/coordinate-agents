name: Legacy Plugin CI
on:
  pull_request:
    paths: &legacy-paths
      - '.codex-plugin/**'
      - '.agents/**'
      - '.mcp.json'
      - '.codexignore'
      - 'mcp/**'
      - 'adapter-sdk.mjs'
      - 'examples/**'
      - 'bin/coordinate-agents-legacy.mjs'
      - 'lib/**'
      - '!lib/web-cli.mjs'
      - 'schemas/**'
      - 'skills/coordinate-agents/**'
      - 'inspector/server/**'
      - 'inspector/web/**'
      - 'test/**'
      - '!test/workspace-message.test.mjs'
      - '!test/web-distribution.test.mjs'
      - '!test/release-artifact.test.mjs'
      - '!test/release-workflow.test.mjs'
      - '!test/tar-capability.test.mjs'
      - '!test/native-folder-picker.test.mjs'
      - '!test/terminal-polling.test.mjs'
      - '!test/zen-mode.test.mjs'
      - '!test/support/workspace-server.mjs'
      - 'scripts/demo.mjs'
      - '.github/workflows/adapter-sdk-acceptance.yml'
  push:
    branches: [main]
    paths: *legacy-paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: legacy-plugin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  compatibility:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '18.x'
          - os: ubuntu-latest
            node: '22.x'
          - os: macos-latest
            node: '22.x'
          - os: windows-latest
            node: '22.x'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Adapter SDK compatibility
        run: npm run test:adapters
      - name: Legacy CLI and gateway compatibility
        run: npm run test:legacy
      - name: Plugin and MCP distribution compatibility
        run: npm run test:plugin
      - name: Repository indexes and offline demo
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22.x'
        run: npm run check:llms && npm run demo
