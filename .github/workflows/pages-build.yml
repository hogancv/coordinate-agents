name: Pages Build

on:
  # Pages settings use the platform's legacy main:/docs deployment. This job
  # supplies PR-only documentation validation, without rebuilding main pushes.
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/pages-build.yml'
  workflow_dispatch:

concurrency:
  group: pages-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Jekyll docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build the Pages source without deploying
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./docs
          destination: ./_site
          build_revision: ${{ github.sha }}
